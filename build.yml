name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Write project files
        run: |
          mkdir -p app/src/main/java/com/example/subvoice app/src/main/assets

          cat > settings.gradle.kts <<'KT'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SubtitleVoice"
          include(":app")
          KT

          cat > build.gradle.kts <<'KT'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          KT

          cat > gradle.properties <<'KT'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g
          KT

          cat > app/build.gradle.kts <<'KT'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.subvoice"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.subvoice"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
                  ndk {
                      abiFilters += listOf("arm64-v8a")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("cz.adaptech.tesseract4android:tesseract4android:4.7.0")
          }
          KT

          cat > app/src/main/AndroidManifest.xml <<'KT'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE" />
                  </intent>
              </queries>

              <application
                  android:label="Озвучка субтитров"
                  android:icon="@android:drawable/ic_btn_speak_now"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".CaptureService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />
              </application>
          </manifest>
          KT

          cat > app/src/main/java/com/example/subvoice/MainActivity.kt <<'KT'
          package com.example.subvoice

          import android.Manifest
          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {

              private val reqCapture = 100
              private val reqNotif = 101

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val pad = (24 * resources.displayMetrics.density).toInt()
                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(pad, pad, pad, pad)

                  val info = TextView(this)
                  info.textSize = 16f
                  info.text = "Озвучка субтитров из игры.\n\n" +
                      "1. Нажмите «Запустить» и разрешите всё, что попросит телефон.\n" +
                      "2. Откройте приложение Xbox и запустите игру.\n" +
                      "3. Зелёную рамку перетащите на субтитры. Квадрат в правом нижнем углу рамки меняет размер.\n" +
                      "4. Кнопки справа вверху: Пауза, Замок (рамка перестаёт ловить касания), Фильтр, Стоп.\n"
                  root.addView(info)

                  val startBtn = Button(this)
                  startBtn.text = "Запустить"
                  startBtn.setOnClickListener { start() }
                  root.addView(startBtn)

                  val stopBtn = Button(this)
                  stopBtn.text = "Остановить"
                  stopBtn.setOnClickListener {
                      stopService(Intent(this@MainActivity, CaptureService::class.java))
                  }
                  root.addView(stopBtn)

                  setContentView(root)
              }

              private fun start() {
                  if (!Settings.canDrawOverlays(this)) {
                      Toast.makeText(this, "Включите «Поверх других окон» для этого приложения и вернитесь", Toast.LENGTH_LONG).show()
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + packageName)))
                      return
                  }
                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
                  ) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), reqNotif)
                      return
                  }
                  launchCapture()
              }

              private fun launchCapture() {
                  val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  @Suppress("DEPRECATION")
                  startActivityForResult(mpm.createScreenCaptureIntent(), reqCapture)
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == reqNotif) launchCapture()
              }

              @Suppress("DEPRECATION")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == reqCapture && resultCode == RESULT_OK && data != null) {
                      val i = Intent(this, CaptureService::class.java)
                      i.putExtra("code", resultCode)
                      i.putExtra("data", data)
                      startForegroundService(i)
                      Toast.makeText(this, "Запущено. Откройте приложение Xbox", Toast.LENGTH_LONG).show()
                  }
              }
          }
          KT

          cat > app/src/main/java/com/example/subvoice/FrameView.kt <<'KT'
          package com.example.subvoice

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager

          class FrameView(ctx: Context) : View(ctx) {

              lateinit var wm: WindowManager
              lateinit var params: WindowManager.LayoutParams

              private val d = ctx.resources.displayMetrics.density
              private val border = Paint()
              private val handle = Paint()
              private val hs = 36 * d

              private var mode = 0
              private var downX = 0f
              private var downY = 0f
              private var startX = 0
              private var startY = 0
              private var startW = 0
              private var startH = 0

              init {
                  border.color = Color.GREEN
                  border.style = Paint.Style.STROKE
                  border.strokeWidth = 3 * d
                  handle.color = Color.GREEN
                  handle.style = Paint.Style.FILL
              }

              override fun onDraw(canvas: Canvas) {
                  canvas.drawRect(3 * d, 3 * d, width - 3 * d, height - 3 * d, border)
                  canvas.drawRect(width - hs, height - hs, width.toFloat(), height.toFloat(), handle)
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          downX = e.rawX
                          downY = e.rawY
                          startX = params.x
                          startY = params.y
                          startW = params.width
                          startH = params.height
                          mode = if (e.x > width - hs && e.y > height - hs) 2 else 1
                      }
                      MotionEvent.ACTION_MOVE -> {
                          val dx = (e.rawX - downX).toInt()
                          val dy = (e.rawY - downY).toInt()
                          if (mode == 1) {
                              params.x = startX + dx
                              params.y = startY + dy
                          } else {
                              params.width = maxOf((80 * d).toInt(), startW + dx)
                              params.height = maxOf((40 * d).toInt(), startH + dy)
                          }
                          wm.updateViewLayout(this, params)
                      }
                  }
                  return true
              }
          }
          KT

          cat > app/src/main/java/com/example/subvoice/CaptureService.kt <<'KT'
          package com.example.subvoice

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.content.res.Configuration
          import android.graphics.Bitmap
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Handler
          import android.os.HandlerThread
          import android.os.IBinder
          import android.os.Looper
          import android.speech.tts.TextToSpeech
          import android.util.DisplayMetrics
          import android.view.Display
          import android.view.Gravity
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.Toast
          import com.googlecode.tesseract.android.TessBaseAPI
          import java.io.File
          import java.util.Locale

          class CaptureService : Service(), TextToSpeech.OnInitListener {

              companion object {
                  var sharedTess: TessBaseAPI? = null
              }

              private val ui = Handler(Looper.getMainLooper())
              private var projection: MediaProjection? = null
              private var vDisplay: VirtualDisplay? = null
              @Volatile private var reader: ImageReader? = null
              private var capW = 0
              private var capH = 0
              private lateinit var wm: WindowManager
              private var frame: FrameView? = null
              private var frameLp: WindowManager.LayoutParams? = null
              private var panel: LinearLayout? = null
              private var tts: TextToSpeech? = null
              @Volatile private var ttsReady = false
              private var worker: HandlerThread? = null
              private var work: Handler? = null
              @Volatile private var running = false
              @Volatile private var paused = false
              @Volatile private var filterOn = true
              private var locked = false
              private var started = false
              private var lastSpoken = ""
              private var pending = ""
              private var empties = 0

              override fun onBind(intent: Intent?): IBinder? = null

              private fun toast(s: String) {
                  ui.post { Toast.makeText(this, s, Toast.LENGTH_LONG).show() }
              }

              @Suppress("DEPRECATION")
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent == null || started) return START_NOT_STICKY
                  started = true
                  goForeground()
                  val data = intent.getParcelableExtra<Intent>("data")
                  if (data == null) {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  projection = mpm.getMediaProjection(intent.getIntExtra("code", 0), data)
                  projection?.registerCallback(object : MediaProjection.Callback() {
                      override fun onStop() {
                          ui.post { stopSelf() }
                      }
                  }, ui)
                  wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  setupCapture()
                  addOverlays()
                  tts = TextToSpeech(this, this)
                  val t = HandlerThread("ocr")
                  t.start()
                  worker = t
                  work = Handler(t.looper)
                  running = true
                  work?.post {
                      initTess()
                      loop.run()
                  }
                  return START_NOT_STICKY
              }

              private fun goForeground() {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(
                      NotificationChannel("sv", "Озвучка субтитров", NotificationManager.IMPORTANCE_LOW)
                  )
                  val n = Notification.Builder(this, "sv")
                      .setContentTitle("Озвучка субтитров работает")
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .build()
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                  } else {
                      startForeground(1, n)
                  }
              }

              @Suppress("DEPRECATION")
              private fun setupCapture() {
                  val dm = DisplayMetrics()
                  val disp = (getSystemService(Context.DISPLAY_SERVICE) as DisplayManager).getDisplay(Display.DEFAULT_DISPLAY)
                  disp.getRealMetrics(dm)
                  capW = dm.widthPixels
                  capH = dm.heightPixels
                  val old = reader
                  val r = ImageReader.newInstance(capW, capH, PixelFormat.RGBA_8888, 2)
                  reader = r
                  if (vDisplay == null) {
                      vDisplay = projection?.createVirtualDisplay(
                          "sv", capW, capH, dm.densityDpi,
                          DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, r.surface, null, null
                      )
                  } else {
                      vDisplay?.resize(capW, capH, dm.densityDpi)
                      vDisplay?.surface = r.surface
                  }
                  try { old?.close() } catch (e: Throwable) { }
              }

              override fun onConfigurationChanged(newConfig: Configuration) {
                  super.onConfigurationChanged(newConfig)
                  ui.postDelayed({
                      try {
                          setupCapture()
                          val lp = frameLp
                          val fv = frame
                          if (lp != null && fv != null) {
                              lp.x = lp.x.coerceIn(0, maxOf(0, capW - lp.width))
                              lp.y = lp.y.coerceIn(0, maxOf(0, capH - lp.height))
                              wm.updateViewLayout(fv, lp)
                          }
                      } catch (e: Throwable) { }
                  }, 600)
              }

              private fun makeBtn(label: String, onClick: (Button) -> Unit): Button {
                  val b = Button(this)
                  b.text = label
                  b.textSize = 12f
                  b.isAllCaps = false
                  b.minWidth = 0
                  b.minHeight = 0
                  b.setPadding(24, 14, 24, 14)
                  b.setTextColor(Color.WHITE)
                  b.setBackgroundColor(0xCC222222.toInt())
                  b.setOnClickListener { onClick(b) }
                  return b
              }

              private fun addOverlays() {
                  val minDim = minOf(capW, capH)
                  val fv = FrameView(this)
                  fv.wm = wm
                  val lp = WindowManager.LayoutParams(
                      (minDim * 0.9).toInt(), (minDim * 0.2).toInt(),
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.START
                  lp.x = (capW - lp.width) / 2
                  lp.y = (capH * 0.7).toInt()
                  fv.params = lp
                  wm.addView(fv, lp)
                  frame = fv
                  frameLp = lp

                  val p = LinearLayout(this)
                  p.orientation = LinearLayout.VERTICAL
                  p.addView(makeBtn("Пауза") { b ->
                      paused = !paused
                      b.text = if (paused) "Дальше" else "Пауза"
                      if (paused) tts?.stop()
                  })
                  p.addView(makeBtn("Замок") { b ->
                      locked = !locked
                      b.text = if (locked) "Открыть" else "Замок"
                      val cur = frameLp
                      val view = frame
                      if (cur != null && view != null) {
                          cur.flags = if (locked) {
                              cur.flags or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                          } else {
                              cur.flags and WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE.inv()
                          }
                          wm.updateViewLayout(view, cur)
                      }
                  })
                  p.addView(makeBtn("Фильтр: вкл") { b ->
                      filterOn = !filterOn
                      b.text = if (filterOn) "Фильтр: вкл" else "Фильтр: выкл"
                  })
                  p.addView(makeBtn("Стоп") { _ -> stopSelf() })

                  val plp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  )
                  plp.gravity = Gravity.TOP or Gravity.END
                  wm.addView(p, plp)
                  panel = p
              }

              override fun onInit(status: Int) {
                  if (status != TextToSpeech.SUCCESS) {
                      toast("Голосовой движок не запустился")
                      return
                  }
                  val r = tts?.setLanguage(Locale("ru", "RU"))
                  if (r == null || r == TextToSpeech.LANG_MISSING_DATA || r == TextToSpeech.LANG_NOT_SUPPORTED) {
                      toast("Нет русского голоса. Установите его в настройках синтеза речи")
                  } else {
                      ttsReady = true
                  }
                  tts?.setSpeechRate(1.6f)
              }

              private fun initTess() {
                  if (sharedTess != null) return
                  try {
                      val dir = File(filesDir, "tessdata")
                      dir.mkdirs()
                      val f = File(dir, "rus.traineddata")
                      if (!f.exists() || f.length() < 1000) {
                          assets.open("rus.traineddata").use { input ->
                              f.outputStream().use { out -> input.copyTo(out) }
                          }
                      }
                      val api = TessBaseAPI()
                      if (api.init(filesDir.absolutePath, "rus")) {
                          api.setPageSegMode(6)
                          sharedTess = api
                      } else {
                          toast("Не удалось запустить распознавание текста")
                      }
                  } catch (e: Throwable) {
                      toast("Ошибка распознавания: " + e.message)
                  }
              }

              private val loop = object : Runnable {
                  override fun run() {
                      if (!running) return
                      try {
                          if (!paused) processFrame()
                      } catch (e: Throwable) { }
                      work?.postDelayed(this, 200)
                  }
              }

              private fun processFrame() {
                  val api = sharedTess ?: return
                  val r = reader ?: return
                  val lp = frameLp ?: return
                  val img = try { r.acquireLatestImage() } catch (e: Exception) { null } ?: return
                  val full: Bitmap
                  try {
                      val plane = img.planes[0]
                      val rowPadding = plane.rowStride - plane.pixelStride * img.width
                      full = Bitmap.createBitmap(
                          img.width + rowPadding / plane.pixelStride, img.height, Bitmap.Config.ARGB_8888
                      )
                      full.copyPixelsFromBuffer(plane.buffer)
                  } finally {
                      img.close()
                  }
                  val inset = (12 * resources.displayMetrics.density).toInt()
                  val imgW = img.width
                  val imgH = img.height
                  val l = (lp.x + inset).coerceIn(0, imgW - 1)
                  val t = (lp.y + inset).coerceIn(0, imgH - 1)
                  val w = minOf(lp.width - 2 * inset, imgW - l)
                  val h = minOf(lp.height - 2 * inset, imgH - t)
                  if (w < 20 || h < 10) {
                      full.recycle()
                      return
                  }
                  val crop = Bitmap.createBitmap(full, l, t, w, h)
                  full.recycle()
                  val prepared = if (filterOn) binarize(crop) else crop
                  if (prepared !== crop) crop.recycle()
                  api.setImage(prepared)
                  val raw = api.getUTF8Text() ?: ""
                  prepared.recycle()
                  handleText(raw)
              }

              private fun binarize(src: Bitmap): Bitmap {
                  val w = src.width
                  val h = src.height
                  val px = IntArray(w * h)
                  src.getPixels(px, 0, w, 0, 0, w, h)
                  for (i in px.indices) {
                      val c = px[i]
                      val lum = (Color.red(c) * 299 + Color.green(c) * 587 + Color.blue(c) * 114) / 1000
                      px[i] = if (lum > 170) Color.BLACK else Color.WHITE
                  }
                  val out = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                  out.setPixels(px, 0, w, 0, 0, w, h)
                  return out
              }

              private fun handleText(raw: String) {
                  val text = raw.replace("\n", " ").replace(Regex("\\s+"), " ").trim()
                  val cyr = text.count { it in 'А'..'я' || it == 'ё' || it == 'Ё' }
                  if (cyr < 3) {
                      pending = ""
                      empties++
                      if (empties >= 3) lastSpoken = ""
                      return
                  }
                  empties = 0
                  if (similar(text, pending)) {
                      if (!similar(text, lastSpoken)) {
                          lastSpoken = text
                          speak(text)
                      }
                  } else {
                      pending = text
                  }
              }

              private fun speak(text: String) {
                  ui.post {
                      if (ttsReady) tts?.speak(text, TextToSpeech.QUEUE_FLUSH, null, "sv")
                  }
              }

              private fun norm(s: String): String = s.lowercase().filter { it.isLetter() }.take(150)

              private fun similar(a: String, b: String): Boolean {
                  val x = norm(a)
                  val y = norm(b)
                  if (x.isEmpty() || y.isEmpty()) return false
                  var prev = IntArray(y.length + 1) { it }
                  var cur = IntArray(y.length + 1)
                  for (i in 1..x.length) {
                      cur[0] = i
                      for (j in 1..y.length) {
                          val cost = if (x[i - 1] == y[j - 1]) 0 else 1
                          cur[j] = minOf(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost)
                      }
                      val tmp = prev
                      prev = cur
                      cur = tmp
                  }
                  val d = prev[y.length]
                  return 1.0 - d.toDouble() / maxOf(x.length, y.length) >= 0.75
              }

              override fun onDestroy() {
                  running = false
                  work?.removeCallbacksAndMessages(null)
                  worker?.quitSafely()
                  if (::wm.isInitialized) {
                      try { frame?.let { wm.removeView(it) } } catch (e: Throwable) { }
                      try { panel?.let { wm.removeView(it) } } catch (e: Throwable) { }
                  }
                  try { vDisplay?.release() } catch (e: Throwable) { }
                  try { reader?.close() } catch (e: Throwable) { }
                  try { projection?.stop() } catch (e: Throwable) { }
                  tts?.stop()
                  tts?.shutdown()
                  super.onDestroy()
              }
          }
          KT

      - name: Download Russian OCR data
        run: |
          curl -fL -o app/src/main/assets/rus.traineddata https://github.com/tesseract-ocr/tessdata_fast/raw/main/rus.traineddata
          ls -la app/src/main/assets

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubtitleVoice-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SubtitleVoice.apk
          gh release create "apk-${{ github.run_number }}" SubtitleVoice.apk --repo "${{ github.repository }}" --title "APK ${{ github.run_number }}" --notes "Готовый APK"
